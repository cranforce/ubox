site_name: uBox Documentation
site_description: Streamlined user creation, editing, and permission analysis for Salesforce.
site_author: uBox
site_url: https://cranforce.github.io/ubox/
repo_name: ubox
repo_url: https://github.com/cranforce/ubox
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Access & Permissions: getting-started/permissions.md
  - Features:
      - Create User: features/create-user.md
      - Edit User: features/edit-user.md
      - Clone from User: features/clone-from-user.md
      - Assignments: features/assignments.md
      - Permission Set Explorer: features/permission-set-explorer.md
      - Permissions Comparison: features/permissions-comparison.md
      - User Permission Report: features/user-permission-report.md
      - Set Password (Sandbox): features/set-password.md
      - Activity Logs & Notifications: features/logging.md
  - Reference:
      - Architecture: reference/architecture.md
      - Troubleshooting: reference/troubleshooting.md
      - Changelog: reference/changelog.md
