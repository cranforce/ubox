<template>
    <lightning-card title="Permissions Comparison" icon-name="utility:groups">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_medium">
                Select two users to see how their permissions differ — both the assignment
                mechanisms and the effective Salesforce metadata they produce.
            </p>

            <!-- User selection -->
            <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                    <lightning-record-picker
                        label="User A"
                        placeholder="Search users..."
                        object-api-name="User"
                        onchange={handleUserAChange}
                    ></lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                    <lightning-record-picker
                        label="User B"
                        placeholder="Search users..."
                        object-api-name="User"
                        filter={userBFilter}
                        onchange={handleUserBChange}
                    ></lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-var-m-top_x-small">
                    <lightning-button
                        label="Compare"
                        variant="brand"
                        icon-name="utility:side_list"
                        onclick={handleCompare}
                        disabled={compareDisabled}
                    ></lightning-button>
                </div>
            </div>

            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-var-p-around_large">
                    <lightning-spinner alternative-text="Comparing" size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={hasResult}>
                <div class="slds-var-m-top_medium">
                    <template lwc:if={identical}>
                        <div class="slds-box slds-theme_success slds-text-align_center">
                            These two users have identical permissions across all compared categories.
                        </div>
                    </template>

                    <template lwc:if={hasDifferences}>
                        <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                            Showing only differences. A dash (—) means that user does not have the item.
                        </p>
                        <template for:each={sections} for:item="sec">
                            <div key={sec.key} class="slds-var-m-bottom_medium">
                                <div class="slds-text-heading_small slds-var-m-bottom_xx-small">{sec.title}</div>
                                <table class="slds-table slds-table_bordered slds-table_fixed-layout slds-table_cell-buffer cmp-table">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col" class="cmp-col-item"><div class="slds-truncate" title="Item">Item</div></th>
                                            <th scope="col" class="cmp-col-user"><div class="slds-truncate" title={sec.aName}>{sec.aName}</div></th>
                                            <th scope="col" class="cmp-col-user"><div class="slds-truncate" title={sec.bName}>{sec.bName}</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={sec.rows} for:item="r">
                                            <tr key={r.key} class="slds-hint-parent">
                                                <td>
                                                    <strong>{r.item}</strong>
                                                    <template lwc:if={r.secondary}>
                                                        <div class="slds-text-body_small slds-text-color_weak">{r.secondary}</div>
                                                    </template>
                                                </td>
                                                <td class={r.aClass}>{r.aValue}</td>
                                                <td class={r.bClass}>{r.bValue}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
