<template>
    <lightning-modal-header label="Set Password"></lightning-modal-header>

    <lightning-modal-body>
        <!-- Success screen: show the password so the admin can copy/relay it. -->
        <template lwc:if={isDone}>
            <div class="slds-text-color_success slds-var-p-bottom_small">
                <lightning-icon
                    icon-name="utility:success"
                    size="x-small"
                    variant="success"
                    class="slds-var-m-right_x-small"
                ></lightning-icon>
                Password set for <strong>{userName}</strong>.
            </div>
            <p class="slds-text-body_small slds-text-color_weak slds-var-p-bottom_x-small">
                No email is sent. Copy this password and share it securely with the user.
            </p>
            <div class="slds-grid slds-grid_vertical-align-end slds-gutters_x-small">
                <div class="slds-col slds-grow">
                    <lightning-input
                        type="text"
                        label="Password"
                        value={finalPassword}
                        readonly
                    ></lightning-input>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button
                        label="Copy"
                        icon-name="utility:copy"
                        onclick={handleCopy}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <template lwc:else>
        <p class="slds-text-body_small slds-text-color_weak slds-var-p-bottom_small">
            Set a password for <strong>{userName}</strong> directly, without sending a reset email.
            Useful in sandboxes where password-reset emails are not delivered (Salesforce KB 000387826).
        </p>

        <template lwc:if={notSandbox}>
            <div class="slds-box slds-theme_warning slds-var-m-bottom_medium" role="alert">
                <lightning-icon
                    icon-name="utility:warning"
                    size="x-small"
                    class="slds-var-m-right_x-small"
                ></lightning-icon>
                Set Password is available in sandbox orgs only. The action is disabled in this org.
            </div>
        </template>

        <div class="slds-grid slds-grid_vertical-align-end slds-gutters_x-small">
            <div class="slds-col slds-grow">
                <lightning-input
                    data-pwd
                    type={passwordInputType}
                    label="Password"
                    value={password}
                    onchange={handlePasswordChange}
                    disabled={notSandbox}
                ></lightning-input>
            </div>
            <div class="slds-col slds-no-flex">
                <lightning-button
                    label="Generate"
                    icon-name="utility:rotate"
                    onclick={handleGenerate}
                    disabled={notSandbox}
                ></lightning-button>
            </div>
        </div>

        <div class="slds-var-p-top_x-small">
            <lightning-input
                data-pwd-confirm
                type={passwordInputType}
                label="Confirm Password"
                value={confirmPassword}
                onchange={handleConfirmChange}
                disabled={notSandbox}
            ></lightning-input>
        </div>

        <div class="slds-var-p-top_x-small">
            <lightning-input
                type="checkbox"
                label="Show password"
                checked={showPassword}
                onchange={handleToggleShow}
                disabled={notSandbox}
            ></lightning-input>
        </div>

        <template lwc:if={errorMessage}>
            <div class="slds-text-color_error slds-var-p-top_small" role="alert">
                {errorMessage}
            </div>
        </template>
        </template>
    </lightning-modal-body>

    <lightning-modal-footer>
        <template lwc:if={isDone}>
            <lightning-button
                variant="brand"
                label="Done"
                onclick={handleDone}
            ></lightning-button>
        </template>
        <template lwc:else>
            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-var-m-right_x-small"
            ></lightning-button>
            <lightning-button
                variant="brand"
                label="Set Password"
                onclick={handleSetPassword}
                disabled={setDisabled}
            ></lightning-button>
        </template>
    </lightning-modal-footer>
</template>
