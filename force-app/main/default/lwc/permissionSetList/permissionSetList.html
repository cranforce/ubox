<template>
    <div class="slds-var-p-around_small">
        <lightning-input
            type="search"
            label="Search permission sets"
            variant="label-hidden"
            placeholder="Search by label or API name..."
            value={searchTerm}
            onchange={handleSearchChange}
        ></lightning-input>
        <p class="slds-text-body_small slds-text-color_weak slds-var-p-top_x-small">
            {resultCountLabel}
        </p>
    </div>

    <ul class="slds-has-dividers_bottom-space ps-list">
        <template for:each={filteredSets} for:item="ps">
            <li key={ps.id} class={ps.cssClass}>
                <a
                    href="#"
                    data-id={ps.id}
                    data-type={ps.type}
                    onclick={handleSelect}
                    class="slds-truncate ps-link"
                    title={ps.label}
                >
                    <div class="slds-grid slds-grid_vertical-align-center slds-truncate">
                        <div class="slds-truncate ps-label slds-grow">{ps.label}</div>
                        <lightning-badge
                            label={ps.badgeLabel}
                            class={ps.badgeClass}
                        ></lightning-badge>
                    </div>
                    <template lwc:if={ps.namespacePrefix}>
                        <div class="slds-text-body_small slds-text-color_weak slds-truncate">
                            {ps.namespacePrefix}.{ps.name}
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-text-body_small slds-text-color_weak slds-truncate">
                            {ps.name}
                        </div>
                    </template>
                </a>
            </li>
        </template>
    </ul>
</template>
