<template>
    <lightning-card title="Create New User" icon-name="standard:user">
        <div slot="actions">
            <lightning-button
                label="Clone from User"
                icon-name="utility:copy"
                onclick={handleOpenCloneLookup}
                disabled={isLoading}
                class="slds-var-m-right_x-small"
            ></lightning-button>
            <lightning-button
                label="Import Definition"
                icon-name="utility:upload"
                onclick={handleImportClick}
                disabled={isLoading}
                class="slds-var-m-right_x-small"
            ></lightning-button>
            <lightning-button
                label="Paste JSON"
                icon-name="utility:paste"
                onclick={handleOpenImportPaste}
                disabled={isLoading}
            ></lightning-button>
            <input
                type="file"
                accept="application/json,.json"
                class="import-file-input slds-hide"
                onchange={handleImportFileChange}
            />
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- Clone User Lookup -->
        <template lwc:if={showCloneLookup}>
            <div class="slds-var-p-around_medium slds-theme_shade slds-border_bottom">
                <div class="slds-grid slds-align_absolute-center slds-gutters">
                    <div class="slds-col slds-grow">
                        <lightning-record-picker
                            label="Select a user to clone"
                            placeholder="Search users..."
                            object-api-name="User"
                            onchange={handleCloneUserSelected}
                        ></lightning-record-picker>
                    </div>
                    <div class="slds-col slds-no-flex slds-var-p-top_medium">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancelClone}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Import: paste JSON fallback -->
        <template lwc:if={showImportPaste}>
            <div class="slds-var-p-around_medium slds-theme_shade slds-border_bottom">
                <lightning-textarea
                    label="Paste user definition JSON"
                    placeholder="Paste the contents of a uBox user-definition .json file..."
                    value={importPasteValue}
                    onchange={handleImportPasteChange}
                ></lightning-textarea>
                <div class="slds-var-p-top_small">
                    <lightning-button
                        label="Load"
                        variant="brand"
                        onclick={handleImportPasteConfirm}
                        class="slds-var-m-right_x-small"
                    ></lightning-button>
                    <lightning-button label="Cancel" onclick={handleCancelImportPaste}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Import: unresolved-items warning panel -->
        <template lwc:if={hasImportWarnings}>
            <div class="slds-var-p-around_medium">
                <div class="slds-box slds-theme_warning">
                    <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_x-small">
                        <h3 class="slds-text-heading_small">Imported with notes</h3>
                        <lightning-button-icon
                            icon-name="utility:close"
                            variant="bare"
                            alternative-text="Dismiss"
                            onclick={handleDismissWarnings}
                        ></lightning-button-icon>
                    </div>
                    <p class="slds-var-m-bottom_x-small">
                        Set a new <strong>Email</strong>, <strong>Username</strong>, and
                        <strong>Alias</strong> before creating the user.
                    </p>
                    <template lwc:if={importWarnings.originals}>
                        <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                            Original values from the export —
                            Email: {importWarnings.originals.email},
                            Username: {importWarnings.originals.username},
                            Alias: {importWarnings.originals.alias}
                        </p>
                    </template>
                    <template lwc:if={importWarnings.hasUnresolved}>
                        <p class="slds-var-m-bottom_x-small">
                            These items from the definition don't exist in this org and were
                            skipped:
                        </p>
                        <template for:each={importWarnings.groups} for:item="grp">
                            <div key={grp.key} class="slds-var-m-bottom_x-small">
                                <strong>{grp.title}</strong>
                                <ul class="slds-list_dotted slds-var-m-left_medium">
                                    <template for:each={grp.items} for:item="it">
                                        <li key={it.id}>{it.label}</li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </template>

        <template lwc:if={hasLoaded}>
            <div class="slds-grid slds-gutters slds-var-p-around_medium">
                <!-- Left: User Information -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-card title="User Information" icon-name="standard:user">
                        <c-user-info-section
                            user-data={userData}
                            auto-populate={autoPopulate}
                            user-license-options={userLicenseOptions}
                            profile-options={profileOptions}
                            role-options={roleOptions}
                            timezone-options={timezoneOptions}
                            locale-options={localeOptions}
                            email-encoding-options={emailEncodingOptions}
                            language-options={languageOptions}
                            onuserchange={handleUserFieldChange}
                        ></c-user-info-section>
                    </lightning-card>
                </div>

                <!-- Right: Assignments -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                        <!-- Permission Sets Section -->
                        <lightning-accordion-section name="permSets" label="Permission Sets">
                            <c-dual-list-section
                                label="Permission Sets"
                                source-label="Available"
                                selected-label="Selected"
                                options={permissionSetOptions}
                                values={selectedPermissionSetIds}
                                onselectionchange={handlePermSetChange}
                            ></c-dual-list-section>
                        </lightning-accordion-section>

                        <!-- Permission Set Groups Section -->
                        <lightning-accordion-section name="permSetGroups" label="Permission Set Groups">
                            <c-dual-list-section
                                label="Permission Set Groups"
                                source-label="Available"
                                selected-label="Selected"
                                options={permSetGroupOptions}
                                values={selectedPermSetGroupIds}
                                onselectionchange={handlePermSetGroupChange}
                            ></c-dual-list-section>
                        </lightning-accordion-section>

                        <!-- Permission Set Licenses Section -->
                        <lightning-accordion-section name="permSetLicenses" label="Permission Set Licenses">
                            <template lwc:if={hasPermSetLicenseOptions}>
                                <c-dual-list-section
                                    label="Permission Set Licenses"
                                    source-label="Available"
                                    selected-label="Selected"
                                    options={permSetLicenseOptions}
                                    values={selectedPermSetLicenseIds}
                                    onselectionchange={handlePermSetLicenseChange}
                                ></c-dual-list-section>
                            </template>
                            <template lwc:else>
                                <p class="slds-var-p-around_medium slds-text-color_weak">
                                    No permission set licenses available in this org.
                                </p>
                            </template>
                        </lightning-accordion-section>

                        <!-- Public Groups Section -->
                        <lightning-accordion-section name="groups" label="Public Groups">
                            <c-dual-list-section
                                label="Public Groups"
                                source-label="Available"
                                selected-label="Selected"
                                options={publicGroupOptions}
                                values={selectedGroupIds}
                                onselectionchange={handleGroupChange}
                            ></c-dual-list-section>
                        </lightning-accordion-section>

                        <!-- Package Licenses Section -->
                        <lightning-accordion-section name="licenses" label="Package Licenses">
                            <template lwc:if={hasPackageLicenseOptions}>
                                <c-dual-list-section
                                    label="Package Licenses"
                                    source-label="Available"
                                    selected-label="Selected"
                                    options={packageLicenseOptions}
                                    values={selectedPackageLicenseIds}
                                    onselectionchange={handleLicenseChange}
                                ></c-dual-list-section>
                            </template>
                            <template lwc:else>
                                <p class="slds-var-p-around_medium slds-text-color_weak">
                                    No package licenses available in this org.
                                </p>
                            </template>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </div>
            </div>

        </template>

        <div slot="footer">
            <lightning-button
                variant="brand"
                label="Create User"
                onclick={handleCreate}
                disabled={isSubmitting}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
